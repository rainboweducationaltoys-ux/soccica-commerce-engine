<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — Soccica Express</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            color: #333;
            background: #fff;
        }

        a { text-decoration: none; color: #4C3FCB; }

        .nav {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 18px 32px;
        }

        .wordmark { font-weight: 700; font-size: 1.1rem; color: #1B1836; }

        .form-wrap {
            max-width: 380px;
            margin: 64px auto;
            padding: 0 20px;
        }

        h1 { font-size: 1.4rem; margin: 0 0 4px; color: #1B1836; }
        .subtext { color: #777; font-size: 0.9rem; margin: 0 0 24px; }

        label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; color: #444; }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus { border-color: #4C3FCB; }

        button {
            width: 100%;
            margin-top: 20px;
            background: #4C3FCB;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover { background: #3d31a8; }

        .flash {
            background: #fdecea;
            color: #611a15;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .alt-link { margin-top: 16px; font-size: 0.9rem; color: #666; text-align: center; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="wordmark">Soccica Express</div>
    </nav>

    <div class="form-wrap">
        <h1>Log in</h1>
        <p class="subtext">Log in to view your order details.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
            <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <input type="hidden" name="code" value="{{ code }}">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit">Log in</button>
        </form>

        <p class="alt-link">Don't have an account? <a href="{{ url_for('register', code=code) if code else url_for('register') }}">Register</a></p>
    </div>
</body>
</html>
