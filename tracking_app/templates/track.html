<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track your order — {{ order.soc_tracking_code }}</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 560px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 { font-size: 1.4rem; }
        .code {
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .current-status {
            display: inline-block;
            background: #eef6ee;
            color: #256029;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            margin: 12px 0 24px;
        }
        ul.timeline {
            list-style: none;
            padding: 0;
            border-left: 2px solid #ddd;
            margin-left: 6px;
        }
        ul.timeline li {
            position: relative;
            padding: 0 0 18px 20px;
        }
        ul.timeline li::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #888;
        }
        ul.timeline li:last-child::before {
            background: #256029;
        }
        .status-title { font-weight: 600; }
        .note { color: #555; font-size: 0.95rem; }
        .date { color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>Order tracking</h1>
    <p>Tracking code: <span class="code">{{ order.soc_tracking_code }}</span></p>
    <div class="current-status">{{ order.status }}</div>

    <ul class="timeline">
        {% for event in timeline %}
        <li>
            <div class="status-title">{{ event.status }}</div>
            {% if event.public_note %}
            <div class="note">{{ event.public_note }}</div>
            {% endif %}
            <div class="date">{{ event.created_at.strftime("%d %b %Y, %H:%M") }}</div>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
